spring:
  application:
    name: ACCOUNT-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/wiprobankdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

customer:
  service:
    url: http://CUSTOMER-SERVICE/customers

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2